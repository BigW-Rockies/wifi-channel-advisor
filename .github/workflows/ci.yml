name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Offline tests (PowerShell ${{ matrix.ps }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 显式带 -ExecutionPolicy Bypass：托管 runner 的默认策略不保证允许跑 .ps1
          - ps: '5.1'
            run-with: powershell -NoProfile -ExecutionPolicy Bypass -File
          - ps: '7'
            run-with: pwsh -NoProfile -File
    steps:
      - uses: actions/checkout@v4

      # 不需要无线网卡：解析器用 tests/fixtures 里的 netsh 样本输出驱动，
      # 评分模型用合成邻居数据驱动。
      - name: Run offline tests
        shell: cmd
        run: ${{ matrix.run-with }} .\tests\Run-Tests.ps1

      - name: Run example analysis on the bundled CSV
        shell: cmd
        run: ${{ matrix.run-with }} .\examples\Analyze-Sample.ps1

  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop

      # 只卡 Error / ParseError：这条流水线的目的是拦住真正会崩的问题，
      # 不强制 Write-Host 之类的风格偏好（本项目是给人看的 CLI 输出，故意用 Write-Host）。
      - name: Analyze
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error, ParseError
          if ($issues) {
            $issues | Format-Table RuleName, ScriptName, Line, Message -AutoSize | Out-String -Width 200 | Write-Host
            throw "PSScriptAnalyzer reported $($issues.Count) error(s)."
          }
          Write-Host 'PSScriptAnalyzer: clean.'

  test-linux:
    name: Offline tests (Linux / bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # runner 上同样没有无线网卡，走 --csv / --input 的离线路径。
      # 顺带验证「同一份数据，nmcli 与 iw 两种抓取格式结论一致」。
      - name: Run offline tests
        run: bash tests/Run-Tests.sh

      - name: Analyze the bundled CSV with the bash version
        run: |
          bash Get-BestChannel.sh --ssid Maple --csv examples/scan-sample.csv --top 3
          # 结论必须落在 ch13，否则说明评分模型被改坏了
          bash Get-BestChannel.sh --ssid Maple --csv examples/scan-sample.csv | grep -q '切到 ch13'

      - name: Check the script is executable
        run: test -x Get-BestChannel.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只报 warning 及以上；本项目的 CLI 输出风格（echo 中文、无 set -e）是刻意的
      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck -S warning Get-BestChannel.sh tests/Run-Tests.sh
